      H 364 Q 400 144 400 180 V 266 Q 400 282 414 280
      A 48 48 0 1 1 414 328 Q 400 326 400 342
      V 428 Q 400 464 364 464 H 116 Q 80 464 80 428
      V 180 Q 80 144 116 144 Z"/>
    <path fill="url(#shine)" d="
      M 116 144 H 206 Q 222 144 220 130
      A 48 48 0 1 1 260 130 Q 258 144 274 144
      H 364 Q 400 144 400 180 V 266 Q 400 282 414 280
      A 48 48 0 1 1 414 328 Q 400 326 400 342
      V 428 Q 400 464 364 464 H 116 Q 80 464 80 428
      V 180 Q 80 144 116 144 Z"/>
    <!-- >_  drawn as shapes so it looks the same everywhere (no font needed) -->
    <g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="138,248 206,304 138,360"/>
      <line x1="236" y1="372" x2="336" y2="372"/>
    </g>
  </g>
</svg>
